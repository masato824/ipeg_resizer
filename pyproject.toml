[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipeg-resizer"
version = "1.1.0"
description = "JPEG compression to a target file size, preserving EXIF — Streamlit web app plus a desktop/headless batch tool"
readme = "readme.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Masato Takahashi" }]
keywords = ["jpeg", "compression", "exif", "streamlit", "image"]
dependencies = [
    "pillow>=9.0",
    "streamlit>=1.20",
    "qrcode>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
jpeg-resize = "resize:main"

[tool.setuptools]
py-modules = ["compressor", "resize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["F", "E9"]